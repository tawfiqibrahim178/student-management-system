<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="topbar">
        <div class="header-inner">
            <div>
                <p class="eyebrow">Academic Portal</p>
                <h1>Student Management System</h1>
            </div>
            <p class="subtitle">Manage your students efficiently</p>
        </div>
    </header>

    <main class="container">
        <section class="summary-grid" aria-label="Student statistics">
            <article class="summary-card highlight">
                <span>Total Students</span>
                <strong id="studentCount">0</strong>
            </article>
            <article class="summary-card">
                <span>Active Records</span>
                <strong id="activeRecords">0</strong>
            </article>
        </section>

        <section class="panel student-form-panel">
            <h2 id="formTitle">Register New Student</h2>
            <form id="studentForm" novalidate>
                <div class="field-group">
                    <label for="studentName">Student Name</label>
                    <input type="text" id="studentName" placeholder="Student Name" required>
                </div>

                <div class="field-group">
                    <label for="studentId">Student ID</label>
                    <input type="text" id="studentId" placeholder="Student ID" required>
                </div>

                <div class="field-group">
                    <label for="studentEmail">Student Email</label>
                    <input type="email" id="studentEmail" placeholder="Student Email" required>
                </div>

                <div class="button-row">
                    <button type="submit" id="submitButton">Add Student</button>
                    <button type="button" class="secondary" id="cancelEdit" hidden>Cancel</button>
                </div>
                <p id="formMessage" class="form-message" aria-live="polite"></p>
            </form>
        </section>

        <section class="panel student-records">
            <div class="panel-header">
                <h2>Student Records</h2>
            </div>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Student ID</th>
                            <th>Email</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="studentList">
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
